<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Imagem Hero - Seu Projeto Aqui</title>
  <desc id="desc">Ilustração abstrata com gradiente e elementos de interface para servir como banner de landing page.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#g1)" />
  <g filter="url(#shadow)">
    <rect x="80" y="140" rx="24" ry="24" width="1040" height="520" fill="#fff" opacity="0.06" />
  </g>

  <!-- Device / Card -->
  <g transform="translate(120,170)">
    <rect width="900" height="460" rx="20" fill="#fff" opacity="0.08" />
    <rect x="24" y="24" width="852" height="86" rx="12" fill="url(#g2)" />

    <!-- Content blocks -->
    <rect x="36" y="130" width="420" height="22" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="36" y="164" width="320" height="16" rx="6" fill="#ffffff" opacity="0.65" />

    <rect x="36" y="210" width="420" height="180" rx="12" fill="#ffffff" opacity="0.06" />

    <!-- Illustration circles -->
    <circle cx="720" cy="260" r="80" fill="#ffffff" opacity="0.12" />
    <circle cx="820" cy="360" r="40" fill="#ffffff" opacity="0.16" />
  </g>

  <!-- Decorative shapes -->
  <circle cx="1040" cy="120" r="60" fill="#fff" opacity="0.06" />
  <rect x="40" y="40" width="160" height="160" rx="20" fill="#ffffff" opacity="0.03" />

  <!-- Texto sobreposto -->
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="160" y="110" fill="#fff" font-size="54" font-weight="700">Seu Projeto Aqui</text>
    <text x="160" y="162" fill="#eef2ff" font-size="22">Landing page profissional para converter visitantes em clientes.</text>
  </g>
</svg>
